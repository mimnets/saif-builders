# Sveltia CMS configuration: https://github.com/sveltia/sveltia-cms
# Every "Publish" in the admin makes a commit to GitHub → the GitHub Action rebuilds the site (~1–2 min).
# Field names must match src/content.config.ts and src/data/*.json.

backend:
  name: github
  repo: mimnets/saif-builders
  branch: main
  # "Sign in with GitHub" button needs a tiny OAuth helper (free Cloudflare Worker).
  # Setup steps: docs/ADMIN.md → "লগইন সেটআপ". Until then use "Sign in with Token".
  # base_url: https://sveltia-cms-auth.YOUR-ACCOUNT.workers.dev
  commit_messages:
    create: "কনটেন্ট: নতুন {{collection}} “{{slug}}”"
    update: "কনটেন্ট: {{collection}} “{{slug}}” আপডেট"
    delete: "কনটেন্ট: {{collection}} “{{slug}}” মুছে ফেলা"
    uploadMedia: "মিডিয়া: “{{path}}” আপলোড"
    deleteMedia: "মিডিয়া: “{{path}}” মুছে ফেলা"

site_url: https://www.saifbuildersbd.com/
display_url: https://www.saifbuildersbd.com/
logo_url: https://www.saifbuildersbd.com/img/logo-mark.png

# All uploads go to public/uploads and are referenced as /uploads/...
media_folder: public/uploads
public_folder: /uploads

# Photos from phones are huge: convert to WebP and cap the size before committing.
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

editor:
  preview: false

slug:
  encoding: ascii
  clean_accents: true
i18n:
  # Two languages. Bangla is the main language (files without a suffix); English is stored next to it
  # as <name>.en.json / <id>.en.md. In the editor, switch language with the language menu at the top.
  # Fields without i18n are shared (images, numbers, phone…) and are only edited in Bangla.
  structure: multiple_files
  locales:
    - bn
    - en
  default_locale: bn
  omit_default_locale_from_file_path: true

collections:
  # ================================================================
  - name: projects
    label: প্রজেক্ট
    label_singular: প্রজেক্ট
    description: প্রতিটি প্রজেক্টের পেজ। নতুন প্রজেক্ট যোগ করতে “New” চাপুন।
    folder: src/content/projects
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: title
    slug: "{{name_en}}"
    summary: "{{order}}. {{title}} ({{status}})"
    sortable_fields: [ order, title ]
    media_folder: /public/uploads/projects
    public_folder: /uploads/projects
    fields:
      - { label: প্রজেক্টের নাম (বাংলা), name: title, widget: string, i18n: true }
      - { label: প্রজেক্টের নাম (ইংরেজি), name: name_en, widget: string, hint: "ওয়েব লিংক এটা থেকে তৈরি হবে, যেমন tvs-12-storied" }
      - { label: ক্রম, name: order, widget: number, value_type: int, default: 10, hint: "ছোট নম্বর আগে দেখাবে" }
      - label: অবস্থা
        name: status
        widget: select
        options:
          - { label: আসন্ন (শীঘ্রই আসছে), value: upcoming }
          - { label: বুকিং চলছে, value: booking }
          - { label: নির্মাণাধীন, value: ongoing }
          - { label: রেডি ফ্ল্যাট, value: ready }
      - { label: হোম পেজে দেখাবে, name: featured, widget: boolean, default: true }
      - { label: লুকিয়ে রাখুন (ড্রাফট), name: draft, widget: boolean, default: false, required: false }
      - { label: তলা, name: floors, widget: number, value_type: int, required: false }
      - { label: এলাকা, name: location, widget: string, default: "আউচপাড়া, টঙ্গী", i18n: true }
      - { label: গুগল ম্যাপ সার্চ, name: map_query, widget: string, required: false, hint: "ইংরেজিতে রাস্তা/এলাকার নাম, যেমন: Mokter Bari Road, Auchpara, Tongi। বিল্ডিংয়ের নাম বা পোস্ট কোড দিলে গুগল ভুল জায়গা দেখাতে পারে।" }
      - { label: ছোট বর্ণনা (কার্ডে দেখায়), name: tagline, widget: text, i18n: true }
      - { label: প্রধান ছবি, name: cover, widget: image }
      - label: ছবির গ্যালারি
        name: gallery
        widget: list
        summary: "{{fields.caption}}"
        fields:
          - { label: ছবি, name: image, widget: image, i18n: duplicate }
          - { label: ক্যাপশন, name: caption, widget: string, required: false, i18n: true }
        i18n: true
      - label: ফ্লোর প্ল্যান
        name: floor_plans
        widget: list
        summary: "{{fields.size}} বর্গফুট"
        fields:
          - { label: সাইজ (বর্গফুট, ইংরেজি সংখ্যায়), name: size, widget: number, value_type: int, i18n: duplicate }
          - { label: টাইপ, name: label, widget: string, required: false, hint: "যেমন: টাইপ A", i18n: true }
          - { label: বেডরুম, name: beds, widget: string, required: false, hint: "যেমন: ৩ বেড", i18n: true }
          - { label: বাথরুম, name: baths, widget: string, required: false, i18n: true }
          - { label: অন্যান্য রুম, name: rooms, widget: string, required: false, i18n: true }
          - { label: প্ল্যানের ছবি, name: image, widget: image, i18n: duplicate }
        i18n: true
      - { label: বেডরুম (সারসংক্ষেপ), name: bedrooms, widget: string, required: false, i18n: true }
      - { label: কিস্তির মেয়াদ, name: installment, widget: string, required: false, i18n: true }
      - { label: ডাউন পেমেন্ট, name: down_payment, widget: string, required: false, i18n: true }
      - { label: মাসিক কিস্তি, name: monthly, widget: string, required: false, i18n: true }
      - { label: দাম, name: ready_price, widget: string, required: false, i18n: true }
      - { label: সুবিধাসমূহ, name: features, widget: list, field: { label: সুবিধা, name: feature, widget: string, i18n: true }, i18n: true }
      - { label: বিস্তারিত বর্ণনা, name: body, widget: markdown, buttons: [ bold, italic, link, bulleted-list, numbered-list ], editor_components: [], i18n: true }
    i18n: true

  # ================================================================
  - name: settings
    label: সাইট সেটিংস
    description: ফোন, ঠিকানা, লোগো, হোম পেজ আর অফার
    editor: { preview: false }
    files:
      # ---------------------------------------------------------------
      - name: site
        label: যোগাযোগ ও সাধারণ তথ্য
        file: src/data/site.{{locale}}.json
        fields:
          - { label: কোম্পানির নাম, name: name, widget: string, i18n: true }
          - { label: কোম্পানির নাম (ইংরেজি), name: name_en, widget: string }
          - { label: ট্যাগলাইন (ইংরেজি), name: tagline_en, widget: string, required: false, hint: "লোগোর লেখা: Premium Property" }
          - { label: স্লোগান, name: slogan, widget: string, i18n: true }
          - { label: লোগো (পূর্ণ), name: logo, widget: image, hint: "বর্গাকার PNG/SVG। ফুটারে দেখায়।" }
          - { label: লোগো আইকন (ছোট), name: logo_icon, widget: image, required: false, hint: "ছোট সাইজে পড়া যায় এমন অংশ। হেডারে দেখায়।" }
          - { label: ফোন নম্বর, name: phone, widget: string, hint: "ইংরেজি সংখ্যায়, যেমন 01616100001" }
          - { label: হোয়াটসঅ্যাপ নম্বর, name: whatsapp, widget: string, hint: "দেশের কোডসহ, + ছাড়া: 8801616100001" }
          - { label: হোয়াটসঅ্যাপ ডিফল্ট মেসেজ, name: whatsapp_default, widget: string, i18n: true }
          - { label: ফেসবুক পেজ লিংক, name: facebook, widget: string, required: false }
          - { label: ইমেইল, name: email, widget: string, required: false }
          - { label: অফিসের ঠিকানা, name: address, widget: text, i18n: true }
          - { label: গুগল ম্যাপ সার্চ (ইংরেজি), name: map_query, widget: string, hint: "রাস্তা/এলাকার নাম দিন, যেমন: Mokter Bari Road, Auchpara, Tongi। সেভ করার পর ম্যাপে পিন ঠিক জায়গায় আছে কিনা দেখে নিন।" }
          - { label: স্বত্বাধিকারীর নাম, name: owner, widget: string, i18n: true }
          - { label: স্বত্বাধিকারীর পদবি, name: owner_title, widget: string, i18n: true }
          - { label: ফুটারের বর্ণনা, name: footer_about, widget: text, i18n: true }
          - { label: ফুটারের নোট, name: footer_note, widget: string, i18n: true }
          - label: রঙের থিম
            name: theme
            widget: object
            hint: "বদলে Publish করুন, ১–২ মিনিট পর পুরো সাইটে দেখাবে। পছন্দ না হলে আবার আগেরটা বেছে নিন।"
            fields:
              - label: কার্ড ও গাঢ় সেকশনের রঙ
                name: surface
                widget: select
                default: black
                options:
                  - { label: "কালো (লোগোর মতো, বর্তমান)", value: black }
                  - { label: "এসপ্রেসো: উষ্ণ গাঢ় বাদামি", value: espresso }
                  - { label: "গ্রাফাইট: লোগোর ধূসর থেকে", value: graphite }
                  - { label: "ব্রোঞ্জ: কালো থেকে সোনালি আভা", value: bronze }
                  - { label: "হালকা সোনালি: উজ্জ্বল, গাঢ় রঙ ছাড়া", value: light }
              - label: সোনালি রঙের শেড
                name: accent
                widget: select
                default: logo
                options:
                  - { label: "লোগোর সোনালি (বর্তমান)", value: logo }
                  - { label: "গাঢ় সোনালি", value: deep }
                  - { label: "শ্যাম্পেন: হালকা সোনালি", value: champagne }
              - label: ফুটারের রঙ
                name: footer
                widget: select
                default: black
                options:
                  - { label: "সবসময় কালো", value: black }
                  - { label: "কার্ডের রঙের সাথে মিলিয়ে", value: match }
          - { label: গুগলে টাইটেল (SEO), name: seo_title, widget: string, i18n: true }
          - { label: গুগলে বর্ণনা (SEO), name: seo_description, widget: text, hint: "১৫০–১৬০ অক্ষরের মধ্যে রাখুন", i18n: true }
          - { label: শেয়ার ইমেজ (1200×630), name: og_image, widget: image, hint: "ফেসবুক/হোয়াটসঅ্যাপে লিংক শেয়ার করলে এই ছবি দেখায়" }
        i18n: true

      # ---------------------------------------------------------------
      - name: offers
        label: অফার
        file: src/data/offers.{{locale}}.json
        fields:
          - { label: অফার সেকশন দেখাবে, name: show, widget: boolean, default: true }
          - { label: ছোট শিরোনাম, name: eyebrow, widget: string, i18n: true }
          - { label: শিরোনাম, name: heading, widget: string, i18n: true }
          - { label: বর্ণনা, name: intro, widget: text, i18n: true }
          - { label: অফারের শেষ সময়, name: deadline, widget: datetime, required: false, hint: "খালি রাখলে কাউন্টডাউন দেখাবে না" }
          - { label: কাউন্টডাউনের লেখা, name: deadline_label, widget: string, i18n: true }
          - label: অফারসমূহ
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - &icon
                label: আইকন
                name: icon
                widget: select
                options:
                  - { label: "ঢাল / নিরাপত্তা (shield)", value: shield }
                  - { label: "ইট / নির্মাণ (brick)", value: brick }
                  - { label: "ঘড়ি / সময় (clock)", value: clock }
                  - { label: "চ্যাট / আপডেট (chat)", value: chat }
                  - { label: "কাগজ / দলিল (doc)", value: doc }
                  - { label: "ওয়ালেট / কিস্তি (wallet)", value: wallet }
                  - { label: "ট্যাগ / ছাড় (tag)", value: tag }
                  - { label: "টাকা / ক্যাশ (cash)", value: cash }
                  - { label: "উপহার (gift)", value: gift }
                  - { label: "টিকেট / ড্র (ticket)", value: ticket }
                  - { label: "মানুষ / রেফার (users)", value: users }
                  - { label: "বাস / যাতায়াত (bus)", value: bus }
                  - { label: "স্কুল (school)", value: school }
                  - { label: "হাসপাতাল (hospital)", value: hospital }
                  - { label: "ব্যাংক (bank)", value: bank }
                  - { label: "বাজার (cart)", value: cart }
                  - { label: "চাবি (key)", value: key }
                  - { label: "বাড়ি (home)", value: home }
                  - { label: "ভবন (building)", value: building }
                  - { label: "স্তর / ফ্লোর (layers)", value: layers }
                  - { label: "গ্রাফ / লাভ (trend)", value: trend }
                  - { label: "লোকেশন (pin)", value: pin }
                  - { label: "ফোন (phone)", value: phone }
                  - { label: "টিক চিহ্ন (check)", value: check }
                  - { label: "তারা (star)", value: star }
                i18n: duplicate
              - { label: শিরোনাম, name: title, widget: string, i18n: true }
              - { label: বর্ণনা, name: text, widget: text, i18n: true }
              - { label: ব্যাজ, name: badge, widget: string, required: false, i18n: true }
              - { label: চালু আছে, name: active, widget: boolean, default: true, i18n: duplicate }
            i18n: true
        i18n: true

      # ---------------------------------------------------------------
      - name: home
        label: হোম পেজ
        file: src/data/home.{{locale}}.json
        fields:
          - label: হিরো (প্রথম স্ক্রিন)
            name: hero
            widget: object
            fields:
              - { label: উপরের ছোট লেখা, name: badge, widget: string, i18n: true }
              - { label: শিরোনাম, name: title, widget: string, i18n: true }
              - { label: শিরোনাম (রঙিন অংশ), name: title_highlight, widget: string, i18n: true }
              - { label: বর্ণনা, name: text, widget: text, i18n: true }
              - { label: প্রধান বাটন, name: primary_cta, widget: string, i18n: true }
              - { label: প্রধান বাটনের হোয়াটসঅ্যাপ মেসেজ, name: primary_message, widget: string, i18n: true }
              - { label: দ্বিতীয় বাটন, name: secondary_cta, widget: string, i18n: true }
              - { label: স্লাইডের ছবি, name: slides, widget: list, field: { label: ছবি, name: image, widget: image }, i18n: duplicate }
              - label: সংখ্যার ঘর
                name: stats
                widget: list
                summary: "{{fields.label}}: {{fields.value}}{{fields.suffix}}"
                fields:
                  - { label: লেবেল, name: label, widget: string, i18n: true }
                  - { label: মান (বড় লেখা), name: value, widget: string, i18n: true }
                  - { label: মানের পরে (ছোট লেখা), name: suffix, widget: string, required: false, i18n: true }
                i18n: true
            i18n: true

          - label: কেন আমরা
            name: why
            widget: object
            collapsed: true
            fields:
              - { label: ছোট শিরোনাম, name: eyebrow, widget: string, i18n: true }
              - { label: শিরোনাম, name: heading, widget: string, i18n: true }
              - { label: বর্ণনা, name: text, widget: text, i18n: true }
              - { label: উক্তি, name: quote, widget: text, i18n: true }
              - { label: স্বত্বাধিকারীর ছবি, name: owner_photo, widget: image, required: false, i18n: duplicate }
              - label: সুবিধাগুলো
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields: [ *icon, { label: শিরোনাম, name: title, widget: string, i18n: true }, { label: বর্ণনা, name: text, widget: text, i18n: true } ]
                i18n: true
            i18n: true

          - label: সেবা ও ধাপ
            name: services
            widget: object
            collapsed: true
            fields:
              - { label: ছোট শিরোনাম, name: eyebrow, widget: string, i18n: true }
              - { label: শিরোনাম, name: heading, widget: string, i18n: true }
              - { label: বর্ণনা, name: text, widget: text, i18n: true }
              - label: কিস্তিতে ফ্ল্যাট (কার্ড)
                name: installment
                widget: object
                fields:
                  - { label: ব্যাজ, name: badge, widget: string, i18n: true }
                  - { label: শিরোনাম, name: title, widget: string, i18n: true }
                  - { label: বর্ণনা, name: text, widget: text, i18n: true }
                  - { label: তথ্য, name: facts, widget: list, summary: "{{fields.label}}: {{fields.value}}", fields: [ { label: লেবেল, name: label, widget: string, i18n: true }, { label: মান, name: value, widget: string, i18n: true } ], i18n: true }
                i18n: true
              - label: রেডি ফ্ল্যাট (কার্ড)
                name: ready
                widget: object
                fields:
                  - { label: ব্যাজ, name: badge, widget: string, i18n: true }
                  - { label: শিরোনাম, name: title, widget: string, i18n: true }
                  - { label: বর্ণনা, name: text, widget: text, i18n: true }
                  - { label: পেছনের ছবি, name: image, widget: image, required: false, i18n: duplicate }
                  - { label: বাটনে যে প্রজেক্ট খুলবে, name: link_project, widget: relation, collection: projects, value_field: "{{slug}}", search_fields: [ title ], display_fields: [ title ], required: false, i18n: duplicate }
                  - { label: তথ্য, name: facts, widget: list, summary: "{{fields.label}}: {{fields.value}}", fields: [ { label: লেবেল, name: label, widget: string, i18n: true }, { label: মান, name: value, widget: string, i18n: true } ], i18n: true }
                i18n: true
              - { label: ধাপের শিরোনাম, name: steps_heading, widget: string, i18n: true }
